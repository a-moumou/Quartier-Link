name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ── Qualite du code ──────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Verifier la syntaxe PHP
        working-directory: backend
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances frontend
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Auditer les dependances PHP
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Auditer les dependances JavaScript
        working-directory: frontend
        # --audit-level=high : les failles moyennes et faibles connues se
        # trouvent dans des outils de developpement (Vitest, esbuild) qui
        # ne partent pas dans le bundle livre. Les signaler ferait echouer
        # la CI sans risque reel ; on ne bloque que sur high et critical.
        run: npm audit --audit-level=high

  # ── Tests backend ────────────────────────────────────────────
  phpunit:
    name: Tests backend (PHPUnit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, mbstring, zip
          tools: composer:v2

      - name: Installer les dependances
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Executer PHPUnit
        working-directory: backend
        run: vendor/bin/phpunit --colors=never

  # ── Tests frontend ───────────────────────────────────────────
  vitest:
    name: Tests frontend (Vitest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Executer Vitest
        working-directory: frontend
        run: npx vitest run

  # ── Construction des images Docker ───────────────────────────
  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [phpunit, vitest]
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: quartierlink-backend:ci

      - name: Construire l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: quartierlink-frontend:ci
