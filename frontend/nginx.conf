server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── En-tetes de securite ──────────────────────────────────────
    # X-Frame-Options    : interdit l'affichage du site dans une iframe
    #                      tierce, donc le detournement de clic.
    # X-Content-Type-Options : empeche le navigateur de deviner un type
    #                      MIME different de celui annonce.
    # Referrer-Policy    : ne transmet l'URL complete qu'aux pages du
    #                      meme site ; l'exterieur ne recoit que le
    #                      domaine.
    # server_tokens off  : masque le numero de version de Nginx, qui
    #                      renseignerait un attaquant sur les failles
    #                      connues de cette version.
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Proxy API → backend Nginx (port 80 interne)
    location /api/ {
        proxy_pass http://nginx/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy uploads → backend Nginx
    location /uploads/ {
        proxy_pass http://nginx/uploads/;
        proxy_set_header Host $host;
    }

    # React Router — toutes les autres routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
