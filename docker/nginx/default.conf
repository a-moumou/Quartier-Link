server {
    listen 80;
    server_name _;

    # ── En-tetes de securite ──────────────────────────────────────
    # X-Frame-Options    : interdit l'affichage du site dans une iframe
    #                      tierce, donc le detournement de clic.
    # X-Content-Type-Options : empeche le navigateur de deviner un type
    #                      MIME different de celui annonce.
    # Referrer-Policy    : ne transmet l'URL complete qu'aux pages du
    #                      meme site ; l'exterieur ne recoit que le
    #                      domaine.
    # server_tokens off  : masque le numero de version de Nginx, qui
    #                      renseignerait un attaquant sur les failles
    #                      connues de cette version.
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    # Passe les requêtes PHP à PHP-FPM
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Uploads
    location /uploads/ {
        alias /var/www/html/public/uploads/;
    }

    client_max_body_size 10M;
}
