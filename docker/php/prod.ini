; Configuration PHP de production — QuartierLink
; Ne jamais renvoyer d'erreur au navigateur : une trace peut reveler
; des chemins de fichiers, des extraits de code ou de la configuration.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off

upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
